<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HolyFHIR Family Health Records</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #17212b;
        background: #f5f7f9;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(560px, calc(100vw - 48px));
        padding: 40px 0;
      }

      h1 {
        margin: 0 0 14px;
        font-size: 32px;
        line-height: 1.15;
      }

      p {
        margin: 0;
        font-size: 17px;
        line-height: 1.55;
        color: #4d5b68;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
      }

      .mark {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #ffffff;
        border: 1px solid #d9e0e7;
        box-shadow: 0 10px 30px rgba(32, 44, 56, 0.08);
      }

      .pulse {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        background: #e9da50;
        animation: pulse 1.4s ease-in-out infinite;
      }

      .status {
        margin-top: 26px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #26323d;
        font-size: 15px;
      }

      .spinner {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        border: 3px solid #d9e0e7;
        border-top-color: #2f6f73;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(0.72);
          opacity: 0.55;
        }

        50% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <div class="pulse"></div>
        </div>
        <div>
          <h1>HolyFHIR is setting up.</h1>
          <p>The first launch can take a few minutes while the private local database is prepared.</p>
        </div>
      </div>

      <div class="status" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <span>Please keep this window open.</span>
      </div>
    </main>
  </body>
</html>
